name: FF Boost APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: unzip -o ffboost.zip -d ffboost
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: ffboost
      - uses: actions/upload-artifact@v4
        with:
          name: FFBoost-apk
          path: ffboost/app/build/outputs/apk/debug/*.apk
